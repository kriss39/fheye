name: launch watch

# Posts CoFHE mainnet launch events (contracts allowed, intake opened, first encrypted operations)
# to Discord and/or Telegram. Off until the repository variable WATCH_ENABLED is "true"; a skipped
# job uses no Actions minutes. Secrets: DISCORD_WEBHOOK_URL, or TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency: launch-watch

jobs:
  watch:
    if: vars.WATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cli
      # The state file remembers what was already announced; each run saves a new cache entry.
      - uses: actions/cache/restore@v4
        with:
          path: .watch-state.json
          key: watch-state-${{ github.run_id }}
          restore-keys: watch-state-
      - run: node dist-cli/fheye.mjs watch --state .watch-state.json
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .watch-state.json
          key: watch-state-${{ github.run_id }}
